<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HDFC Net Banking - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f3f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .bank-title {
            color: #004c8f;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login-btn {
            width: 100%;
            background: #004c8f;
            color: white;
        }

        .login-btn:hover {
            background: #003b70;
            color: white;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h2 class="bank-title">
        HDFC NET BANKING
    </h2>

    <p class="subtitle">
        Secure Customer Login
    </p>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter your password"
                   required>

        </div>

        <button type="submit"
                class="btn login-btn">
            Login
        </button>

    </form>

    <div class="register-link">

        <span>New customer?</span>

        <a th:href="@{/register}">
            Create Account
        </a>

    </div>

</div>

</body>

</html>
