<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HDFC Daily Statement</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">

            <h2>HDFC DAILY STATEMENT</h2>

            <p class="mb-0"
               th:text="${#temporals.format(#temporals.createNow(), 'dd-MM-yyyy')}">
            </p>

        </div>

        <div class="card-body">

            <div class="row text-center mb-4">

                <div class="col-md-6">

                    <div class="card bg-light">

                        <div class="card-body">

                            <h5>Total Transactions</h5>

                            <h2
                                th:text="${totalTransactions}">
                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card bg-light">

                        <div class="card-body">

                            <h5>Total Amount</h5>

                            <h2>
                                ₹<span
                                th:text="${totalAmount}">
                                </span>
                            </h2>

                        </div>

                    </div>

                </div>

            </div>


            <h4 class="mb-3">
                Today's Transactions
            </h4>


            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>Sender Account</th>

                            <th>Receiver Account</th>

                            <th>Amount</th>

                            <th>Type</th>

                            <th>Status</th>

                            <th>Date</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr th:each="transaction : ${transactions}">

                            <td
                                th:text="${transaction.id}">
                            </td>

                            <td
                                th:text="${transaction.senderAccount}">
                            </td>

                            <td
                                th:text="${transaction.receiverAccount}">
                            </td>

                            <td>
                                ₹<span
                                th:text="${transaction.amount}">
                                </span>
                            </td>

                            <td
                                th:text="${transaction.transactionType}">
                            </td>

                            <td
                                th:text="${transaction.status}">
                            </td>

                            <td
                                th:text="${transaction.transactionDate}">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
