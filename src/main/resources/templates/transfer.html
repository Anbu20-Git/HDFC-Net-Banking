<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Money Transfer - HDFC Net Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f3f6fa;
        }

        .navbar {
            background: #004c8f;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .transfer-card {
            max-width: 550px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .title {
            color: #004c8f;
            font-weight: bold;
        }

        .transfer-btn {
            background: #004c8f;
            color: white;
            width: 100%;
        }

        .transfer-btn:hover {
            background: #003b70;
            color: white;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/dashboard}">
            HDFC NET BANKING
        </a>

    </div>

</nav>

<div class="container">

    <div class="transfer-card">

        <h2 class="title text-center">
            Money Transfer
        </h2>

        <p class="text-center text-muted">
            Transfer money securely
        </p>

        <hr>

        <!-- Message -->

        <div th:if="${message}"
             class="alert alert-info"
             th:text="${message}">
        </div>

        <!-- Account Details -->

        <div class="alert alert-light">

            <p>
                <strong>Your Account:</strong>
                <span th:text="${account.accountNumber}">
                </span>
            </p>

            <p class="mb-0">

                <strong>Available Balance:</strong>

                ₹<span th:text="${account.balance}">
                </span>

            </p>

        </div>

        <!-- Transfer Form -->

        <form th:action="@{/transfer}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Receiver Account Number
                </label>

                <input type="text"
                       name="receiverAccount"
                       class="form-control"
                       placeholder="Enter receiver account number"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Amount
                </label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       placeholder="Enter amount"
                       min="1"
                       step="0.01"
                       required>

            </div>

            <button type="submit"
                    class="btn transfer-btn">
                Transfer Money
            </button>

        </form>

        <div class="text-center mt-3">

            <a th:href="@{/dashboard}">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>

</html>
