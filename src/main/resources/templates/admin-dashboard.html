<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - HDFC Net Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f3f6fa;
        }

        .navbar {
            background: #004c8f;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .admin-container {
            margin-top: 35px;
        }

        .title {
            color: #004c8f;
            font-weight: bold;
        }

        .stat-card {
            border: none;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            background: white;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-top: 25px;
        }

        .table th {
            background: #004c8f;
            color: white;
        }

    </style>

</head>

<body>

	<nav class="navbar">

	    <div class="container">

	        <span class="navbar-brand">
	            HDFC NET BANKING - ADMIN
	        </span>

	        <a th:href="@{/logout}"
	           class="btn btn-light btn-sm">

	            Logout

	        </a>

	    </div>

	</nav>


<div class="container admin-container">

    <h2 class="title">
        Admin Dashboard
    </h2>

    <p class="text-muted">
        Banking system overview
    </p>


    <!-- Statistics -->

    <div class="row g-4 mt-2">

        <div class="col-md-4">

            <div class="stat-card">

                <h6>Total Users</h6>

                <h2 th:text="${#lists.size(users)}">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <h6>Total Accounts</h6>

                <h2 th:text="${#lists.size(accounts)}">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="stat-card">

                <h6>Total Transactions</h6>

                <h2 th:text="${#lists.size(transactions)}">
                    0
                </h2>

            </div>

        </div>

    </div>


    <!-- Users -->

    <div class="table-card">

        <h4>
            All Users
        </h4>

        <hr>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="user : ${users}">

                    <td th:text="${user.id}">
                    </td>

                    <td th:text="${user.name}">
                    </td>

                    <td th:text="${user.email}">
                    </td>

                    <td th:text="${user.phone}">
                    </td>

                    <td th:text="${user.role}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- Accounts -->

    <div class="table-card">

        <h4>
            All Accounts
        </h4>

        <hr>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Account Number</th>
                    <th>Account Type</th>
                    <th>Balance</th>
                    <th>User ID</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="account : ${accounts}">

                    <td th:text="${account.id}">
                    </td>

                    <td th:text="${account.accountNumber}">
                    </td>

                    <td th:text="${account.accountType}">
                    </td>

                    <td>
                        ₹<span th:text="${account.balance}">
                        </span>
                    </td>

                    <td th:text="${account.user.id}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- Transactions -->

    <div class="table-card">

        <h4>
            All Transactions
        </h4>

        <hr>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Sender</th>
                    <th>Receiver</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Date</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="transaction : ${transactions}">

                    <td th:text="${transaction.id}">
                    </td>

                    <td th:text="${transaction.senderAccount}">
                    </td>

                    <td th:text="${transaction.receiverAccount}">
                    </td>

                    <td>
                        ₹<span th:text="${transaction.amount}">
                        </span>
                    </td>

                    <td th:text="${transaction.transactionType}">
                    </td>

                    <td th:text="${transaction.status}">
                    </td>

                    <td th:text="${transaction.transactionDate}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
