<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HDFC Net Banking - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f3f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .bank-title {
            color: #004c8f;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .btn-register {
            background: #004c8f;
            color: white;
            width: 100%;
        }

        .btn-register:hover {
            background: #003b70;
            color: white;
        }

    </style>

</head>

<body>

<div class="register-card">

    <h2 class="bank-title">
        HDFC NET BANKING
    </h2>

    <p class="subtitle">
        Create Your Account
    </p>

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   placeholder="Enter your name"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   placeholder="Enter your email"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   placeholder="Enter password"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Phone Number
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   required>

        </div>

        <button type="submit"
                class="btn btn-register">
            Create Account
        </button>

    </form>

</div>

</body>

</html>
