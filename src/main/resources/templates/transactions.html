<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transaction History - HDFC Net Banking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f3f6fa;
        }

        .navbar {
            background: #004c8f;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .history-card {
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .title {
            color: #004c8f;
            font-weight: bold;
        }

        .table th {
            background: #004c8f;
            color: white;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .debit {
            color: red;
            font-weight: bold;
        }

        .credit {
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/dashboard}">
            HDFC NET BANKING
        </a>

    </div>

</nav>


<div class="container">

    <div class="history-card">

        <h2 class="title">
            Transaction History
        </h2>

        <p class="text-muted">

            Account Number:

            <strong th:text="${account.accountNumber}">
            </strong>

        </p>

        <hr>


        <div th:if="${#lists.isEmpty(transactions)}"
             class="alert alert-info">

            No transactions found.

        </div>


        <div th:unless="${#lists.isEmpty(transactions)}"
             class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>Date</th>

                    <th>Sender</th>

                    <th>Receiver</th>

                    <th>Amount</th>

                    <th>Type</th>

                    <th>Status</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="transaction : ${transactions}">

                    <td th:text="${transaction.transactionDate}">
                    </td>

                    <td th:text="${transaction.senderAccount}">
                    </td>

                    <td th:text="${transaction.receiverAccount}">
                    </td>

                    <td>

                        ₹<span
                            th:text="${transaction.amount}">
                        </span>

                    </td>

                    <td th:text="${transaction.transactionType}">
                    </td>

                    <td class="success"
                        th:text="${transaction.status}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <div class="mt-3">

            <a th:href="@{/dashboard}"
               class="btn btn-primary">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
